<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Host Capabilities</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="wrap.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Host Capabilities</h1>
    <div class="muted">What apps may do on this Mac beyond their own folders. Nothing here is on until you allow it for a specific app.</div>
  </div>
</header>
<div id="banners" aria-live="polite"></div>
<main class="settings">
  <section class="panel" id="sec-macos" data-role="macos-panel"></section>
  <section class="panel" id="sec-stop" data-role="stop-panel"></section>
  <section class="panel" id="sec-overlay" data-role="overlay-panel"></section>
  <section class="panel" id="sec-gpu" data-role="gpu-panel"></section>
  <section class="panel" id="sec-tools" data-role="tools-panel"></section>
  <section class="panel" id="sec-mcp" data-role="mcp-panel"></section>
</main>
<div id="modal-root"></div>
<script src="dom.js"></script>
<script src="settings.js"></script>
</body>
</html>
