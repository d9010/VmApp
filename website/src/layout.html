<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{css}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<header class="top">
  <div class="in">
    <a class="brand" href="/"><img src="/assets/logo.svg" alt="" width="28" height="28"><b>{{name}}</b></a>
    <nav aria-label="Main">
      {{nav}}
    </nav>
    <a class="gh" href="{{repo}}">GitHub</a>
  </div>
</header>
<main id="main" class="{{mainClass}}">
{{content}}
</main>
<footer class="foot">
  <div class="wrap">
    <p><strong>{{name}}</strong> is open source (MIT). Copyright &copy; {{year}} <a href="{{companyUrl}}">{{company}}</a>.</p>
    <p><a href="{{repo}}">Source on GitHub</a> &middot; <a href="/docs/">Documentation</a> &middot; <a href="/roadmap">Roadmap</a> &middot; <a href="/docs/security-policy">Report a security problem</a></p>
    <p class="small">This site is static: it has no cookies, no accounts and no trackers.</p>
  </div>
</footer>
</body>
</html>
